<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#050809">
<meta name="description" content="七月半，娘娘要收人。一部现代农村悬疑恐怖文字冒险。">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="水位线">
<title>水位线</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
</head>
<body>
<style>
:root{color-scheme:dark;--ink:#060809;--paper:#ece5d3;--dim:#aaa493;--faint:#6f6b61;--cin:#d0402f;--cin2:#8e1f19;--water:#62a094;--lantern:#eab452;--line:rgba(236,229,211,.14);--win:.8;--fs:17px;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;--brush:"Ma Shan Zheng","STKaiti","KaiTi",cursive;--hand:"Long Cang","Ma Shan Zheng","STKaiti",cursive;}
html,body{height:100%;margin:0;background:#000;}
body{color:var(--paper);font-family:var(--serif);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;}
button{font-family:inherit;color:inherit;cursor:pointer;}
button:focus-visible{outline:1px solid var(--lantern);outline-offset:2px;}
#app{position:fixed;inset:0;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
#app.shake{animation:shake .55s linear;}
@keyframes shake{0%,100%{transform:none}10%{transform:translate(-8px,3px)}20%{transform:translate(7px,-4px)}30%{transform:translate(-6px,-2px)}40%{transform:translate(5px,4px)}55%{transform:translate(-3px,2px)}70%{transform:translate(2px,-2px)}85%{transform:translate(-1px,1px)}}
#app.glitch #adv .tx,#app.glitch #nvl{transform:skewX(-5deg) translateX(4px);filter:hue-rotate(-25deg) contrast(1.3);}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;}
#grain{position:absolute;inset:-60%;pointer-events:none;opacity:.09;mix-blend-mode:overlay;z-index:2;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain 1.1s steps(6) infinite;}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-4%,3%)}40%{transform:translate(3%,-5%)}60%{transform:translate(-6%,-2%)}80%{transform:translate(5%,4%)}}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:12;}
#flash.white{background:#f3efe6;animation:fl .7s ease-out;}#flash.red{background:#9a0f0a;animation:fl 1.1s ease-out;}#flash.black{background:#000;animation:bo 1.6s ease-in-out;}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}@keyframes bo{0%{opacity:0}35%,65%{opacity:1}100%{opacity:0}}
#pulse{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:2;background:radial-gradient(ellipse at 50% 50%,transparent 38%,rgba(140,8,4,.6) 100%);}
#pulse.on{animation:pulse 1.05s ease-in-out infinite;}@keyframes pulse{0%,100%{opacity:0}18%{opacity:.9}32%{opacity:.25}46%{opacity:.7}70%{opacity:0}}
.drop1{position:absolute;top:-20px;width:3px;height:14px;z-index:3;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;background:rgba(170,215,210,.75);animation:drop1 1.4s cubic-bezier(.55,0,1,.45) forwards;}@keyframes drop1{to{transform:translateY(110vh)}}
#stage{position:absolute;inset:0;z-index:3;}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;z-index:6;pointer-events:none;}
#date{font-size:12px;letter-spacing:.2em;color:var(--dim);text-shadow:0 1px 4px #000;}
#date b{color:var(--cin);font-weight:600;margin-right:.6em;}
#loc{position:absolute;left:16px;top:calc(env(safe-area-inset-top,0px) + 34px);z-index:6;pointer-events:none;opacity:0;display:flex;align-items:baseline;gap:.7em;padding-left:12px;border-left:2px solid var(--cin);text-shadow:0 1px 6px #000;}
#loc b{font-family:var(--brush);font-weight:400;font-size:22px;letter-spacing:.12em;}#loc span{font-size:11px;letter-spacing:.35em;color:var(--dim);}
#loc.on{animation:loc 4.2s ease forwards;}@keyframes loc{0%{opacity:0;transform:translateX(-10px)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
#toast{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 84px);transform:translate(0,-10px);z-index:30;opacity:0;transition:.4s;pointer-events:none;background:rgba(8,12,11,.94);border:1px solid var(--line);border-left:3px solid var(--lantern);padding:9px 16px;display:flex;gap:.8em;align-items:baseline;white-space:nowrap;max-width:calc(100% - 32px);}
#toast.on{opacity:1;transform:none;}#toast small{font-size:11px;letter-spacing:.2em;color:var(--lantern);}#toast b{font-weight:600;font-size:14px;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;}

/* ---------- ADV ---------- */
#adv{position:absolute;left:0;right:0;bottom:0;z-index:5;pointer-events:none;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 50px);background:linear-gradient(180deg,rgba(3,6,6,0) 0,rgba(3,6,6,calc(var(--win)*.9)) 26px,rgba(3,6,6,var(--win)) 100%);transition:opacity .35s,transform .35s;}
#adv.hide{opacity:0;transform:translateY(12px);}
.advin{max-width:880px;margin:0 auto;position:relative;padding-top:26px;}
.advin::before{content:"";position:absolute;left:0;right:0;top:12px;height:1px;background:linear-gradient(90deg,var(--cin) 0,var(--cin) 46px,rgba(236,229,211,.22) 46px,rgba(236,229,211,.05) 100%);}
.nmrow{position:absolute;left:0;top:-12px;display:flex;align-items:center;gap:12px;opacity:0;transform:translateY(4px);transition:.25s;}
#adv.has-name .nmrow{opacity:1;transform:none;}
#seal{--sc:#ccc;width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--sc);background:rgba(10,8,6,.85);transform:rotate(-4deg);box-shadow:0 0 0 1px rgba(0,0,0,.6),inset 0 0 12px rgba(0,0,0,.6);}
#seal span{font-family:var(--brush);font-size:28px;line-height:1;color:var(--sc);filter:drop-shadow(0 0 6px rgba(0,0,0,.8));}
#seal.pop{animation:pop .35s ease;}@keyframes pop{0%{transform:rotate(-4deg) scale(1.25);opacity:.2}100%{transform:rotate(-4deg) scale(1);opacity:1}}
#nm{font-size:15px;letter-spacing:.3em;font-weight:600;text-shadow:0 1px 4px #000;}
#tx{font-size:var(--fs);line-height:1.95;letter-spacing:.03em;min-height:calc(var(--fs)*1.95*3.2);max-height:34vh;overflow-y:auto;text-shadow:0 1px 3px rgba(0,0,0,.9);padding:22px 0 4px;pointer-events:auto;scrollbar-width:none;}
#adv:not(.has-name) #tx{padding-top:10px;}
#tx::-webkit-scrollbar{display:none;}
#tx.think{color:#cbd6cf;font-style:normal;}#tx.think::before{content:"";display:inline-block;width:14px;height:1px;background:var(--water);vertical-align:middle;margin-right:.6em;}
.c{opacity:0;}.c.on{opacity:1;transition:opacity .14s;}
.r{color:var(--cin);font-weight:600;}.k{display:inline-block;animation:jit .18s steps(2) infinite;}
@keyframes jit{0%{transform:translate(0,0)}50%{transform:translate(.6px,-.8px)}100%{transform:translate(-.6px,.6px)}}
#drop{position:absolute;right:4px;bottom:-4px;width:10px;height:10px;opacity:0;}
#drop.on{opacity:1;}#drop::before{content:"";position:absolute;left:1px;top:0;width:8px;height:8px;background:var(--water);border-radius:0 50% 50% 50%;transform:rotate(45deg);animation:dripa 1.6s ease-in infinite;}
#drop::after{content:"";position:absolute;left:-6px;bottom:-6px;width:22px;height:6px;border:1px solid var(--water);border-radius:50%;opacity:0;animation:ripa 1.6s ease-out infinite;}
@keyframes dripa{0%{transform:translateY(-6px) rotate(45deg);opacity:0}30%{opacity:1}70%{transform:translateY(4px) rotate(45deg);opacity:1}80%,100%{transform:translateY(6px) rotate(45deg);opacity:0}}
@keyframes ripa{0%,72%{opacity:0;transform:scale(.3)}80%{opacity:.8}100%{opacity:0;transform:scale(1.3)}}
.m-nvl #adv{display:none;}.m-adv #nvl{display:none;}

/* ---------- NVL ---------- */
#nvl{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 58px);bottom:calc(env(safe-area-inset-bottom,0px) + 52px);margin:0 auto;max-width:780px;padding:18px 22px 12px;box-sizing:border-box;overflow:hidden;z-index:5;pointer-events:none;font-size:var(--fs);line-height:2;background:linear-gradient(180deg,rgba(3,6,6,calc(var(--win)*.5)),rgba(3,6,6,var(--win)) 10%,rgba(3,6,6,var(--win)) 90%,rgba(3,6,6,calc(var(--win)*.5)));transition:opacity .3s;}
@media (min-width:820px){#nvl{border-left:1px solid var(--line);border-right:1px solid var(--line);padding:26px 42px 16px;}}
#nvl.hide{opacity:0;}#nvl.dim .ln{opacity:.3;}#nvl.dim .ln:last-child{opacity:1;}
.ln{margin:0 0 .75em;text-shadow:0 1px 2px rgba(0,0,0,.9);}.ln.old{opacity:.6;}.ln.think{color:#c9d3cc;padding-left:.8em;border-left:2px solid rgba(98,160,148,.55);}
.ln .who{font-size:.78em;letter-spacing:.14em;margin-right:.4em;font-weight:600;}.ln.center{text-align:center;font-family:var(--brush);font-size:1.9em;line-height:1.5;color:var(--cin);letter-spacing:.2em;margin:1em 0;}

/* ---------- big stinger ---------- */
#big{position:absolute;inset:0;z-index:9;display:grid;place-items:center;padding:24px;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),rgba(0,0,0,.2) 70%);}
#big.on{opacity:1;pointer-events:auto;}#big div{font-family:var(--brush);font-size:clamp(34px,11vw,72px);line-height:1.35;color:var(--cin);letter-spacing:.14em;text-align:center;text-shadow:0 0 30px rgba(208,64,47,.45),0 2px 0 #000;text-wrap:balance;}
#big.on div{animation:bigin .9s ease both;}@keyframes bigin{0%{opacity:0;transform:scale(1.12);filter:blur(6px)}60%{opacity:1;filter:blur(0)}100%{transform:scale(1)}}

/* ---------- choices ---------- */
#choices{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 70px);bottom:calc(env(safe-area-inset-bottom,0px) + 210px);z-index:8;display:flex;flex-direction:column;gap:10px;justify-content:center;align-items:center;padding:0 16px;pointer-events:none;}
.m-nvl #choices{bottom:calc(env(safe-area-inset-bottom,0px) + 70px);top:40%;}
#choices button{pointer-events:auto;width:100%;max-width:580px;text-align:left;background:linear-gradient(90deg,rgba(6,10,9,.96),rgba(10,15,14,.9));border:1px solid rgba(236,229,211,.2);padding:14px 18px 14px 44px;font-size:15.5px;line-height:1.6;letter-spacing:.03em;position:relative;animation:cin .45s ease both;box-shadow:0 8px 30px rgba(0,0,0,.45);}
#choices button i{position:absolute;left:18px;top:50%;width:9px;height:9px;margin-top:-5px;border:1px solid var(--water);transform:rotate(45deg);transition:.2s;}
#choices button::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--lantern);transition:width .35s;}
#choices button:hover,#choices button:focus-visible{border-color:rgba(234,180,82,.6);outline:none;}#choices button:hover::after{width:100%;}#choices button:hover i{background:var(--water);}
#choices button.mem{border-color:rgba(208,64,47,.7);color:#f6dcd4;box-shadow:0 0 24px rgba(208,64,47,.2),inset 0 0 20px rgba(208,64,47,.12);}
#choices button.mem i{border-color:var(--cin);background:var(--cin);animation:memg 1.6s ease-in-out infinite;}@keyframes memg{50%{box-shadow:0 0 12px var(--cin)}}
@keyframes cin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- quick bar ---------- */
#qbar{position:absolute;left:0;right:0;bottom:0;z-index:7;display:flex;justify-content:center;gap:2px;padding:4px 8px calc(env(safe-area-inset-bottom,0px) + 8px);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;}
#qbar::-webkit-scrollbar{display:none;}#qbar.off{display:none;}
#qbar button{background:none;border:none;font-size:12.5px;letter-spacing:.16em;color:rgba(236,229,211,.55);padding:8px 8px;white-space:nowrap;flex:0 0 auto;transition:color .2s;}
#qbar button:hover{color:var(--paper);}#qbar button.on{color:var(--lantern);}
#qbar .dsk{display:none;}@media (min-width:720px){#qbar .dsk{display:inline-block;}#qbar{gap:6px;}}
#app.hideui #adv,#app.hideui #nvl,#app.hideui #qbar,#app.hideui #hud,#app.hideui #loc{opacity:0!important;pointer-events:none;}

/* ---------- danmu / stamp ---------- */
#danmu{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 60px);height:32%;z-index:6;pointer-events:none;overflow:hidden;}
.dm{position:absolute;left:100%;white-space:nowrap;font-size:14px;color:#fff;text-shadow:0 0 3px #000,0 0 2px #000;animation:dm var(--d,7s) linear forwards;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;}@keyframes dm{to{transform:translateX(calc(-100vw - 110%))}}
#stamp{position:absolute;left:50%;top:38%;z-index:9;transform:translate(-50%,-50%) rotate(-6deg) scale(1.6);font-family:"Arial Black","Helvetica Neue",sans-serif;font-weight:900;font-size:clamp(54px,17vw,120px);color:rgba(190,30,22,.92);opacity:0;pointer-events:none;filter:url(#rough);white-space:nowrap;}
#stamp.on{animation:stamp 2.6s ease-out forwards;}@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-6deg) scale(1.7)}12%{opacity:.95;transform:translate(-50%,-50%) rotate(-6deg) scale(1)}75%{opacity:.85}100%{opacity:0;transform:translate(-50%,-50%) rotate(-6deg) scale(1)}}

/* ---------- waterline title block ---------- */
.wlt{position:relative;display:inline-flex;flex-direction:column;align-items:center;margin:.3em 0 .2em;}
.wlt .up{font-family:var(--brush);font-size:clamp(46px,14vw,96px);line-height:1.08;color:var(--paper);letter-spacing:.1em;text-indent:.1em;animation:wlup 1.2s .35s ease both;text-shadow:0 0 30px rgba(0,0,0,.6);}
.wlt.big .up{font-size:clamp(58px,19vw,128px);}
.wlt .wl{display:block;width:calc(100% + 60px);height:2px;background:var(--cin);box-shadow:0 0 12px rgba(208,64,47,.7);transform-origin:left;animation:wlline .9s ease both;}
.wlt .dn{font-family:var(--brush);font-size:clamp(46px,14vw,96px);line-height:1.08;color:var(--water);letter-spacing:.1em;text-indent:.1em;transform:scaleY(-1);opacity:.5;-webkit-mask-image:linear-gradient(0deg,rgba(0,0,0,.9),transparent 75%);mask-image:linear-gradient(0deg,rgba(0,0,0,.9),transparent 75%);filter:blur(.6px);animation:wldn 1.2s .6s ease both,wave 4s 1.8s ease-in-out infinite;}
.wlt.big .dn{font-size:clamp(58px,19vw,128px);}
@keyframes wlline{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes wlup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes wldn{from{opacity:0}to{opacity:.5}}
@keyframes wave{0%,100%{transform:scaleY(-1) skewX(0)}50%{transform:scaleY(-1) skewX(-3deg) translateX(3px)}}

/* ---------- cards ---------- */
#card{position:absolute;inset:0;z-index:20;background:#030404;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center;opacity:0;pointer-events:none;transition:opacity .9s;}
#card.on{opacity:1;pointer-events:auto;}#card:not(.on) *{animation-play-state:paused;}
#card .k1{font-size:12px;letter-spacing:.5em;text-indent:.5em;color:var(--dim);animation:wlup 1s ease both;}
#card .k3{font-size:13px;letter-spacing:.35em;color:var(--water);margin-top:-.2em;animation:wlup 1s 1s ease both;}
#card .k4{max-width:30em;font-size:15px;line-height:2.1;color:#d4cdbd;margin-top:.8em;animation:wlup 1.2s 1.2s ease both;}#card .k4 p{margin:0;}
#card .k5{margin-top:22px;font-size:13px;letter-spacing:.18em;color:#8e8a80;line-height:2;}
#card .tap{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);font-size:11px;letter-spacing:.4em;color:var(--faint);animation:blink 2.2s 1.6s ease-in-out infinite both;}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
#card.end-false .k1{color:var(--cin);}#card.end-true .k1{color:var(--lantern);}#card.end-true .wl{background:var(--lantern);box-shadow:0 0 14px rgba(234,180,82,.7);}
#card .mem{border:1px solid rgba(208,64,47,.45);padding:18px 22px;margin-top:14px;max-width:28em;text-align:left;background:rgba(208,64,47,.06);animation:wlup 1s .4s ease both;}
#card .mem h4{margin:0 0 .7em;font-size:12px;letter-spacing:.35em;color:var(--cin);font-weight:600;}#card .mem p{margin:.25em 0;font-size:16px;line-height:1.9;font-family:var(--hand);font-size:20px;}

/* ---------- credits ---------- */
#credits{position:absolute;inset:0;z-index:19;background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,.55) 30%,rgba(0,0,0,.55) 70%,rgba(0,0,0,.85));overflow:hidden;opacity:0;pointer-events:none;transition:opacity 1.5s;}
#credits.on{opacity:1;pointer-events:auto;}#credits .roll{position:absolute;left:0;right:0;top:100%;text-align:center;animation:roll 50s linear forwards;padding:0 16px;}
#credits.on .roll{animation-play-state:running;}@keyframes roll{to{transform:translateY(calc(-100% - 100vh))}}
#credits h1{font-family:var(--brush);font-weight:400;font-size:clamp(48px,14vw,90px);letter-spacing:.2em;margin:0 0 .2em;}#credits h3{font-size:12px;letter-spacing:.5em;color:var(--water);font-weight:400;margin:0 0 1.2em;}
#credits .r{display:flex;justify-content:center;gap:1.4em;font-size:15px;line-height:2.3;letter-spacing:.1em;}#credits .r span{color:var(--dim);min-width:8em;text-align:right;}#credits .r b{font-weight:400;min-width:8em;text-align:left;}
#credits p{font-size:14px;color:var(--dim);letter-spacing:.12em;line-height:2;margin:.2em 0;}#credits .q{font-family:var(--hand);font-size:24px;color:var(--paper);line-height:1.8;margin-top:1em;}#credits .g{height:14vh;}
#credits .tap{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);font-size:11px;letter-spacing:.3em;color:var(--faint);}

/* ---------- title ---------- */
#title{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);box-sizing:border-box;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 45%,rgba(0,0,0,.55));transition:opacity 1s;}
#title.off{opacity:0;pointer-events:none;}
#title .wlt .up{font-size:clamp(84px,27vw,170px);}#title .wlt .dn{font-size:clamp(84px,27vw,170px);}
#title .wlt .wl{position:relative;width:min(calc(100% + 40px),94vw);}#title .wlt .wl::after{content:"▲318.5";position:absolute;right:2px;top:-1.7em;font:900 13px/1 "Arial Black",sans-serif;color:var(--cin);letter-spacing:.04em;}
.tsub{margin:-.6em 0 0;font-size:14px;letter-spacing:.55em;text-indent:.55em;color:#d3cab6;animation:wlup 1.2s 1.2s ease both;}
#tmenu{margin-top:34px;display:flex;flex-direction:column;gap:2px;min-width:240px;animation:wlup 1.2s 1.6s ease both;}
#tmenu button{background:none;border:none;border-bottom:1px solid rgba(236,229,211,.1);padding:12px 18px;display:flex;justify-content:center;align-items:baseline;gap:.8em;color:#e5ddca;transition:color .2s,letter-spacing .3s;}
#tmenu button span{font-size:16px;letter-spacing:.45em;text-indent:.45em;}#tmenu button small{font-size:11px;letter-spacing:.15em;color:var(--dim);}
#tmenu button:hover span{color:var(--lantern);letter-spacing:.6em;}#tmenu button.warn span{color:var(--cin);letter-spacing:.12em;font-size:14px;}
#tfoot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;font-size:11px;letter-spacing:.22em;color:#8f8a7f;}

/* ---------- modal ---------- */
#modal{position:absolute;inset:0;z-index:25;background:rgba(3,5,5,.93);display:flex;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 12px);box-sizing:border-box;transition:opacity .3s;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
#modal.off{opacity:0;pointer-events:none;}
.mbox{width:100%;max-width:980px;display:flex;flex-direction:column;min-height:0;}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 10px;}
.mhead h2{margin:0;font-family:var(--brush);font-weight:400;font-size:30px;letter-spacing:.16em;display:flex;align-items:center;gap:.5em;}
.mhead h2::before{content:"";width:22px;height:2px;background:var(--cin);display:inline-block;}

== start
[bg black]
[bgm none]
[date |]
[wait 700]
我小时候问过妈妈一次：外婆家在哪里？
她正在切菜。刀停了一下，然后接着切下去，切得比刚才快。
妈妈：「在山里。很远。」
林默：「有多远？」
妈妈：「远到你不用去。」
那是我唯一一次问。后来我学会了不问，就像学会了不在她面前提起外公，不在饭桌上夹鱼，不在她发呆的时候跟她说话。
二十年里，她一次都没有回去过。
三年前外公去世，舅舅家没人，村里打电话来催她回去办丧事。她在阳台上站了一整夜，第二天去银行汇了一笔钱，然后照常去上班。
我一直以为，那只是因为她和家里关系不好。
那个夏天以后我才知道，有些人不回家，是因为家里有一口潭。
[chap 序　章|红色的数字|农历七月初九 · 二〇二四年夏]
-> p_bus

== p_bus
[bg road dusk]
[bgm none]
[se bus]
[date 序章|七月初九]
中巴车在盘山公路上拐到第四十几个弯的时候，手机信号掉成了一格。
我把相机从包里拿出来，对着窗外拍了几秒。暮色从山谷底下往上涨，一层一层地把山吞进去，只剩最高的几道山脊还挂着一点橘红色。
取景框里的画面很好看。好看到不像真的。
我叫林默，二十岁，省城一所大学新闻系大二。这个暑假的作业是一部十五分钟的纪录片，题目我早就想好了——《最后的沉潭》。
沉潭村，我外婆住的村子。明年春天，下游的狮子岩水库要下闸蓄水，整个村子都会沉到水底下。
这个题目报上去的时候，指导老师眼睛都亮了：“有温度，有冲突，有时代感。”
他不知道的是，我选它，一半是为了作业，另一半是为了一个我问不出口的问题。
司机：「后生，你是去沉潭的？」
开车的是个五十来岁的男人，一路上嚼着槟榔，这是他第一次开口。
林默：「嗯，去我外婆家。」
司机：「哪家的？」
林默：「许家。我外公叫许有田。」
后视镜里，司机的眼睛看了我一眼，又挪回路上。
司机：「……许有田啊。」
他没再说下去。车厢里只剩下发动机哼哼唧唧的声音，和后排一只竹笼里偶尔扑腾一下的鸡。
车转过一个急弯，山谷一下子敞开了。
[bg dam dusk]
[bgm drone]
下面是一片灰白色的工地。巨大的混凝土坝体横在两山之间，像一道还没愈合的伤口。塔吊的长臂伸在半空，顶上的红灯一闪，一闪。
坝体中间刷着一行红字，隔着这么远都看得清楚。
[stamp ▲318.5]
司机：「看见那个数没得？」
林默：「三百一十八点五？」
司机：「海拔。明年水就涨到那里。那个数底下的屋，全部要淹掉。」
他把槟榔渣吐进一个矿泉水瓶里。
司机：「你外婆签字没得？」
林默：「签了吧。她说年底就搬到县城的安置小区去。」
司机：「签了好。签了好。」
他把这三个字念了两遍，像是在念什么保平安的话。
过了很久，久到我以为他不会再说话了，他忽然又开口。
司机：「后生，这几天莫在沉潭待太晚。」
林默：「为什么？」
司机：「七月半嘛。」
林默：「七月半怎么了？」
他没回答。车窗外，工地的红灯被山挡住，一下子不见了。
司机：「七月十四那天晚上，你莫出门。莫去潭边。」
林默：「……」
司机：「你去了就晓得了。沉潭的人，嘴巴紧。」
-> p_stop

== p_stop
[bg village dusk]
[bgm cicada]
[se bus]
车在一棵大樟树底下停住，把我和两个编织袋一起吐了出来。
樟树大得离谱，四五个人都抱不过来，树冠像一朵乌云压在村口。树底下有一个褪了色的站牌，写着“沉潭村”。
蝉鸣像一层厚厚的毛毯，从四面八方盖下来。
我拖着箱子往前走了两步，然后停住了。
村口第一栋老屋的白墙上，用红漆刷着一个数字。
▲318.5
第二栋也有。第三栋也有。
一路看过去，每一栋房子的墙上都有那个数字，高度差不多，都在人胸口那么高。红漆刷得很粗，有的地方淌下来，干成一道一道的细线。
我举起相机。
取景框里，那些红字连成了一条线。一条横穿整个村子的线。
线以上，是墙、窗户、晒着的衣服、屋檐下的燕子窝。

## t_gazette|《青崖县志 · 风俗》沉潭条|d1_story|文书
沉潭，在县西北六十里，四山环抱，其水深碧不见底。旧名青螺潭。

明嘉靖间，里中有妇，夫亡守寡，族人诬其不贞，缚置竹笼，沉之潭心。是岁秋，山水暴发，漂没田庐，溺死者数十人。里人以为妇之冤魂所致，因名其潭曰“沉潭”，立祠于潭东石矶之上，奉以为神，号“潭娘娘”。

岁七月望前一夕，里人束纸为灯，状如莲花，燃烛放之潭中，谓之“送娘娘”。择里中未字女子一人，朱砂涂面，衣赤袍，立于渡口歌之。又编竹为笼，纳纸人其中，沉之，谓之“替身”。相传行此礼，则娘娘不复索人。

按：此俗近于淫祀，然里人奉之甚谨，莫敢或违。

## t_minamata|水俣病|c4_sh,b4_sh_a|百科
水俣病是由甲基汞引起的中毒性神经系统疾病，因一九五六年在日本熊本县水俣市被正式确认而得名。

当地一家化工厂在生产中使用汞作为催化剂，含有甲基汞的废水长期排入水俣湾。甲基汞在鱼贝类体内富集，居民长期食用被污染的海产后发病。常见症状包括：手脚麻木、运动失调、震颤、言语障碍、视野缩小、听力下降，重者出现精神错乱、瘫痪乃至死亡。

在人类发病之前，当地的猫已经出现抽搐、狂奔、打转，甚至扑进海里的现象，被当地人称为“猫在跳舞”。

一九六五年，日本新潟县阿贺野川流域也发生了同类事件。此后数十年间，经正式认定的患者有两千多人，许多人终生未获认定。

二〇一三年，旨在全球减少汞污染的《关于汞的水俣公约》在熊本签署，于二〇一七年生效。

——

另：北美和北欧的长期研究发现，新建水库蓄水以后，被淹没的土壤和植被会促使水中的汞转化为毒性更强的甲基汞，库区鱼类体内的汞含量往往会升高，并持续十几年甚至更久。

我想妈妈。

const PI2=Math.PI*2;
function mulberry(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------------- runner ---------------- */
function isRead(n,i){return!!(P.read[n]&&P.read[n].indexOf(','+i+',')>=0);}

function onEnter(n){if(!P.seen[n]){P.seen[n]=1;}
  if(FLOW_NODES[n]){const snap=JSON.parse(JSON.stringify(S));snap.node=n;snap.ip=0;snap.lineNode=n;snap.lineIp=0;snap.page=[];P.snaps[n]=snap;}
  (TIPS_BY_NODE[n]||[]).forEach(id=>unlockTip(id));(ACH_BY_NODE[n]||[]).forEach(id=>unlockAch(id));
  if(VAR_BY_NODE[n]){P.vars[n]=1;if(VARIANTS.every(v=>P.vars[v.n]))unlockAch('allvar');}saveP();}
let lineCount=0;
function run(){let guard=0;while(guard++<6000){const node=NODES[S.node];if(!node){showLine({t:'narr',text:'（脚本错误：找不到节点「'+S.node+'」）'});return;}
  if(S.ip===0&&!S._entered){S._entered=S.node;onEnter(S.node);}
  const op=node.ops[S.ip];if(!op){showLine({t:'narr',text:'（脚本错误：节点「'+S.node+'」没有出口）'});return;}
  if(op.t==='goto'){jump(op.to);continue;}
  if(op.t==='cmd'){const r=exec(op.cmd,op.args);if(r==='jump')continue;S.ip++;if(r==='wait')return;continue;}
  if(op.t==='choice'){S.lineNode=S.node;S.lineIp=S.ip;pushHist();showChoices();return;}
  if(skipOn&&!P.set.skipAll&&!isRead(S.node,S.ip))setSkip(false);
  S.lineNode=S.node;S.lineIp=S.ip;S.page.push([S.node,S.ip]);if(S.page.length>40)S.page.shift();
  markRead(S.node,S.ip);pushHist();showLine(op);S.ip++;if(++lineCount%12===0)autoSave();return;}}
function jump(to){S.node=to;S.ip=0;S._entered=null;}
function exec(cmd,a){switch(cmd){
  case 'bg':{const parts=a.split(/\s+/);const bg=parts[0];const ht=!!(parts[1]&&TIMES[parts[1]]);const tm=ht?parts[1]:S.time;S.loc=parts.slice(ht?2:1).join(' ')||null;S.bg=bg;S.time=tm;S.cg=null;S.weather='none';RD.weather('none');RD.clearCG();RD.set(bg,tm,skipOn?'cut':'fade');AU.amb(ambFor());S.page=[];if(P.set.mode==='nvl')nvl.innerHTML='';showLoc();return;}
  case 'time':S.time=a;RD.set(S.bg,a,'fade');AU.amb(ambFor());return;
  case 'cg':if(a==='off'){S.cg=null;RD.cg('off');}else{S.cg=a;RD.cg(a);if(!P.cgs[a]){P.cgs[a]=1;saveP();}}return;
  case 'weather':S.weather=a||'none';RD.weather(S.weather);AU.amb(ambFor());return;
  case 'mood':S.mood=a==='none'?null:a;RD.mood(S.mood);return;
  case 'amb':S.amb=a==='auto'?null:a;AU.amb(ambFor());return;
  case 'bgm':setMusic(a);return;
  case 'se':if(!skipOn)AU.sfx(a);return;
  case 'fx':fx(a);return;
  case 'clear':S.page=[];nvl.innerHTML='';return;
  case 'date':S.date=a;renderDate();return;
  case 'set':applySet(a);return;
  case 'stamp':if(!skipOn)stamp(a);return;
  case 'danmu':if(!skipOn)danmu(a);return;
  case 'clue':addClue(a);return;
  case 'tips':unlockTip(a);return;
  case 'ach':unlockAch(a);return;
  case 'unlock':if(a==='ex'){P.ex=true;saveP(true);}return;
  case 'goto':jump(a);return 'jump';
  case 'if':{const i=a.lastIndexOf(' goto ');if(i<0)return;if(cond(a.slice(0,i))){jump(a.slice(i+6).trim());return 'jump';}return;}
  case 'wait':{waiting=true;setTimeout(()=>{waiting=false;run();},window.__swlFast?2:skipOn?40:(parseInt(a,10)||600));return 'wait';}
  case 'chap':{const [t1,t2,t3]=a.split('|');showChapter(t1||'',t2||'',t3||'');autoSave();return 'wait';}
  case 'end':showEnd(a);return 'wait';
  case 'credits':showCredits();return 'wait';
  case 'title':inGame=false;store.del('swl2_s0');toTitle();return 'wait';}}
function fx(n){const f=$('#flash');if(!P.set.fx&&['shake','red','white','glitch'].includes(n)){if(n!=='shake'&&n!=='glitch'){f.className='';void f.offsetWidth;f.className='black';}return;}
  if(skipOn&&['shake','white','red','black','glitch'].includes(n))return;
  if(n==='shake'){app.classList.remove('shake');void app.offsetWidth;app.classList.add('shake');setTimeout(()=>app.classList.remove('shake'),560);}
  else if(['white','red','black'].includes(n)){f.className='';void f.offsetWidth;f.className=n;}
  else if(n==='pulse')$('#pulse').classList.add('on');else if(n==='unpulse')$('#pulse').classList.remove('on');
  else if(n==='drip'){const d=document.createElement('div');d.className='drop1';d.style.left=(20+Math.random()*60)+'%';app.appendChild(d);setTimeout(()=>d.remove(),1500);}
  else if(n==='rain'){S.weather='rain';RD.weather('rain');AU.amb(ambFor());}
  else if(n==='glitch'){RD.glitch(10);app.classList.add('glitch');setTimeout(()=>app.classList.remove('glitch'),300);}}

function danmu(a){const box=$('#danmu');const cols=['#fff','#fff','#ffe08a','#9fe8ff','#fff','#ffb3b3'];a.split('|').forEach((t,i)=>setTimeout(()=>{const d=document.createElement('div');d.className='dm';d.textContent=t.trim();d.style.top=(4+((i*29)%78))+'%';d.style.color=cols[i%cols.length];d.style.setProperty('--d',(6+Math.random()*3).toFixed(1)+'s');box.appendChild(d);setTimeout(()=>d.remove(),10000);},i*600+Math.random()*300));}
let toastQ=[],toastOn=false;function toast(kind,title){toastQ.push([kind,title]);if(!toastOn)nextToast();}

function addClue(id){if(!CLUES[id])return;if(S.clues.indexOf(id)<0){S.clues.push(id);if(!P.clues[id]){P.clues[id]=1;if(CLUE_ORDER.every(k=>P.clues[k]))unlockAch('allclue');}saveP();if(!skipOn)AU.ui('clue');toast('线索已记录',CLUES[id][0]);}}

/* ---------------- history / rollback ---------------- */
function snapState(){return JSON.stringify(Object.assign({},S,{node:S.lineNode,ip:S.lineIp,_entered:S.lineIp===0?null:S.lineNode}));}
function pushHist(){HIST.push(snapState());if(HIST.length>160){HIST.shift();LOG.forEach(l=>l.h--);}}
function rollback(steps){if(!inGame||cardOpen||creditsOn)return;steps=steps||1;if(HIST.length<=steps){toast('回退','已经到头了');return;}setSkip(false);setAuto(false);if(typing){clearTimeout(typing.t);typing=null;}
  for(let i=0;i<steps;i++)HIST.pop();const st=JSON.parse(HIST.pop());while(LOG.length&&LOG[LOG.length-1].h>=HIST.length)LOG.pop();resumeFrom(st,false);}
function resumeFrom(st,instantVisual){S=Object.assign(fresh(),st);choicesEl.innerHTML='';choosing=false;app.classList.remove('choosing');waiting=false;bigOpen=false;$('#big').classList.remove('on');
  const prevBg=RD.state();if(prevBg.bg!==S.bg||prevBg.time!==S.time||instantVisual)RD.set(S.bg,S.time,instantVisual?'cut':'fade');RD.clearCG();if(S.cg)RD.cg(S.cg);RD.weather(S.weather);RD.mood(S.mood);setMusic(S.bgm);AU.amb(ambFor());renderDate();
  nvl.innerHTML='';if(P.set.mode==='nvl'){const pg=(S.page||[]).slice(0,-1);pg.forEach(([n,i])=>{const op=NODES[n]&&NODES[n].ops[i];if(!op)return;const p=document.createElement('p');p.className='ln old'+(op.t==='think'?' think':'')+(op.t==='center'?' center':'');p.innerHTML=(op.t==='say'?`<span class="who" style="color:${(CAST[op.who]||{}).c}">${esc(op.who)}</span>`:'')+spansHTML(op.text).replace(/class="c/g,'class="c on');nvl.appendChild(p);});while(nvl.scrollHeight>nvl.clientHeight&&nvl.children.length>1)nvl.firstChild.remove();}
  S.node=S.lineNode;S.ip=S.lineIp;if(S.page.length)S.page.pop();run();}

/* NATIVE_LIFECYCLE_START */
// Called inside the game's engine scope so snapshots use the existing save format.
function installNativeLifecycle() {
  let paused = false;
  const pause = () => {
    paused = true;
    setAuto(false);
    setSkip(false);
    autoSave();
    saveP(true);
    AU.suspend();
  };
  const resume = () => {
    if (!paused) return;
    paused = false;
    if ($('#warn').classList.contains('off')) AU.resume();
  };
  const back = () => {
    const confirm = $('#confirm');
    if (confirm.classList.contains('on')) { confirm.classList.remove('on'); return true; }
    if ($('#cgview').classList.contains('on')) { $('#cgview').classList.remove('on'); return true; }
    if (isModal()) { closeModal(); return true; }
    if (hidden) { setHidden(false); return true; }
    if (inGame || cardOpen) { setAuto(false); setSkip(false); openModal('menu'); return true; }
    return false;
  };
  window.swlNative = Object.freeze({ pause, resume, back });
  document.addEventListener('visibilitychange', () => document.hidden ? pause() : resume());
  window.addEventListener('pagehide', pause);
  window.addEventListener('beforeunload', pause);
  // Some mobile WebViews only allow audio to resume after a fresh gesture.
  document.addEventListener('pointerdown', () => { if (!document.hidden && $('#warn').classList.contains('off')) AU.resume(); }, { passive: true });
}

installNativeLifecycle();
